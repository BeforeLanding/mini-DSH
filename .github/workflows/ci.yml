name: CI
run-name: ${{ inputs.component_development_execute && 'SWE-dev-b713df5768dc816a-30-usd17' || 'CI' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "PROGRESS.md"
      - "README.md"
      - "AGENTS.md"
      - "docs/history/**"
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_probe:
        description: Verify that a failing assertion keeps CI red and uploads TAP
        type: boolean
        default: false
      swebench_poc:
        description: Run the pinned public SWE-bench gold adjudication probe without a model
        type: boolean
        default: false
      component_environment_probe:
        description: Verify the five frozen SWE task images without a model or credentials
        type: boolean
        default: false
      component_development_preflight:
        description: Restore and validate the reviewed development batch without a model key
        type: boolean
        default: false
      component_development_execute:
        description: Execute only the separately authorized 30-episode $17 development batch
        type: boolean
        default: false
      authorized_manifest_sha256:
        description: Required reviewed manifest SHA-256 for a paid first dispatch
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.component_development_execute && 'SWE-dev-b713df5768dc816a-30-usd17' || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.component_development_execute }}

jobs:
  test:
    name: Check and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build and check emitted ESM
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Run unit and integration tests
        id: tests
        shell: bash
        env:
          MINI_DSH_CI_DIAGNOSTIC_PROBE: ${{ inputs.diagnostic_probe || 'false' }}
        run: |
          if [ "$MINI_DSH_CI_DIAGNOSTIC_PROBE" = true ]; then
            printf "import assert from 'node:assert/strict'; import test from 'node:test'; test('CI diagnostic probe', () => assert.equal(1, 2));\n" > dist/test/ci-diagnostic-probe.test.js
          fi
          set -o pipefail
          node --test --test-reporter=tap dist/test/*.test.js 2>&1 | tee test-results.tap

      - name: Upload failed test TAP
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-tap-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results.tap
          if-no-files-found: error
          retention-days: 7

  # R08：隔离测试不能只靠本地环境变量。这个 job 真的安装 bwrap、准备固定 runtime，
  # 跑平台无关契约、隔离实测与 V2 fixture；出现任何 skip 即失败，避免“跳过即绿”。
  isolation:
    name: Isolation (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 的 AppArmor 默认限制无特权 user namespace，bwrap 会在配置
      # loopback 时得到 RTM_NEWADDR: Operation not permitted。解除这条系统限制；
      # 若内核没有该键，allow 失败仍由下面的 preflight/测试显式暴露。
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Prepare pinned Linux runtime
        run: |
          sh scripts/eval-v2-prepare-runtime.sh "$RUNNER_TEMP/v2-runtime"
          echo "MINI_DSH_V2_RUNTIME=$RUNNER_TEMP/v2-runtime/unpack" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm check

      - name: Run required isolation tests
        id: isolation_tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            dist/test/eval-v2-isolation-contract.test.js \
            dist/test/eval-v2-isolation.test.js \
            dist/test/eval-v2-fixtures.test.js 2>&1 | tee isolation.tap
          if grep -Eq '(^|[[:space:]])# SKIP([[:space:]]|$)|^not ok .*# SKIP' isolation.tap; then
            echo "required isolation tests reported a skip" >&2
            exit 1
          fi

      - name: Upload isolation TAP
        if: failure() && steps.isolation_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolation-tap-ubuntu-node-22
          path: isolation.tap
          if-no-files-found: error
          retention-days: 7

  # R11：从 tarball 安装到仓库外的含空格路径，验证打包清单、bin、零 key 命令与离线 demo。
  package-install:
    name: Package install (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm check

      - name: Pack and install outside the repository
        shell: bash
        run: |
          set -euo pipefail
          pack="$RUNNER_TEMP/package"
          install="$RUNNER_TEMP/consumer space"
          work="$RUNNER_TEMP/sample project"
          mkdir -p "$pack" "$install" "$work"
          pnpm pack --pack-destination "$pack"
          tarball=$(find "$pack" -name '*.tgz' -print -quit)
          (cd "$install" && pnpm add --ignore-scripts "$tarball")
          cli="$install/node_modules/.bin/mini-dsh"
          "$cli" --version | grep -qx '0.1.0'
          "$cli" --help | grep -q 'demo \[fix\]'
          (cd "$work" && "$cli" --show-config | grep -q '"readHistory"')
          (cd "$work" && "$cli" demo fix | grep -q 'demo result: PASS')
          "$cli" inspect "$GITHUB_WORKSPACE/docs/samples/provider-recovery/events.jsonl" | grep -q 'complete JSONL'
          if find "$pack" -name '*.tgz' -exec tar -tzf {} \; | grep -Eq 'package/(test|docs|\.env)|package/.*samples'; then
            echo 'tarball contains files outside the runtime package'
            exit 1
          fi

  component-development:
    name: Reviewed SWE development batch
    if: github.event_name == 'workflow_dispatch' && (inputs.component_development_preflight || inputs.component_development_execute)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.component_development_execute && 360 || 60 }}
    permissions:
      contents: read
      actions: read
    env:
      SWE_INPUT_ROOT: ${{ runner.temp }}/swe-development-inputs
      SWE_EVIDENCE_ROOT: ${{ runner.temp }}/swe-development-evidence
      SWE_PUBLIC_ROOT: ${{ runner.temp }}/swe-development-public
      SWE_EXECUTION_LOG: ${{ runner.temp }}/swe-development-execution.log
      SWE_EXPECTED_SHA256: b713df5768dc816ae39a893e9aba3e73010ec102e8ab34b9426e6f54525f3e82
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'

      - name: Build and test input, evidence and first-attempt guards
        run: pnpm install --frozen-lockfile && pnpm check && node --test .github/scripts/*.test.mjs

      - name: Restore the compatible pinned baseline and official scorer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/swe-python"
          "$RUNNER_TEMP/swe-python/bin/python" -m pip install --requirement docs/samples/swe-component-python-20261030.txt
          git clone --depth 1 --branch v3.0.17 https://github.com/SWE-bench/SWE-bench.git "$RUNNER_TEMP/swe-official"
          test "$(git -C "$RUNNER_TEMP/swe-official" rev-parse HEAD)" = 3f01bd622c0a22c00406139f69a234ef08225f22
          "$RUNNER_TEMP/swe-python/bin/python" -m pip install --constraint docs/samples/swe-component-python-20261030.txt --editable "$RUNNER_TEMP/swe-official"
          "$RUNNER_TEMP/swe-python/bin/python" -m pip check
          echo "$RUNNER_TEMP/swe-python/bin" >> "$GITHUB_PATH"

      - name: Restore the exact reviewed manifest and separate scoring inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/swe-public-dataset" "$SWE_PUBLIC_ROOT"
          curl --fail --location --retry 2 \
            'https://huggingface.co/datasets/princeton-nlp/SWE-bench_Verified/resolve/c104f840cc67f8b6eec6f759ebc8b2693d585d4a/data/test-00000-of-00001.parquet' \
            --output "$RUNNER_TEMP/swe-public-dataset/verified.parquet"
          echo "a45b1fe4e2f0c8390b2b2938ac83e92ed5979000856808f3679c07812e9e6dcd  $RUNNER_TEMP/swe-public-dataset/verified.parquet" | sha256sum --check
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pyarrow.parquet as pq
          root = Path(os.environ['RUNNER_TEMP']) / 'swe-public-dataset'
          rows = pq.read_table(root / 'verified.parquet').to_pylist()
          (root / 'rows.json').write_text(json.dumps(rows, default=str), encoding='utf-8')
          PY
          node .github/scripts/swe-development-inputs.mjs \
            --template docs/samples/swe-component-development-template-20261030.json \
            --rows "$RUNNER_TEMP/swe-public-dataset/rows.json" \
            --expected-sha256 "$SWE_EXPECTED_SHA256" --output "$SWE_INPUT_ROOT"

      - name: Verify the external baseline fingerprint and pull the five pinned images
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { fingerprintBaseline } from './dist/scripts/swebench/external-fingerprint.js';
          const manifest = JSON.parse(await fs.readFile(process.env.SWE_INPUT_ROOT + '/manifest.json', 'utf8'));
          const expected = manifest.arms.find(arm => arm.system === 'external').external;
          const fingerprint = fingerprintBaseline(process.env.RUNNER_TEMP + '/swe-python/bin/python');
          if (fingerprint.version !== expected.version || fingerprint.upstreamConfigSha256 !== expected.upstreamConfigSha256 || fingerprint.installSha256 !== expected.installSha256) throw new Error('remote baseline install differs from frozen baseline');
          await fs.writeFile(process.env.SWE_PUBLIC_ROOT + '/baseline-fingerprint.json', JSON.stringify(fingerprint, null, 2) + '\n');
          const config = JSON.parse(await fs.readFile('docs/samples/swe-component-environment-20261030.json', 'utf8'));
          for (const image of config.images) {
            const reference = image.repository + '@' + image.digest;
            const pull = spawnSync('docker', ['pull', reference], { stdio: 'inherit', timeout: 900_000 });
            if (pull.status !== 0) throw new Error('frozen image pull failed');
            const inspect = spawnSync('docker', ['image', 'inspect', reference], { encoding: 'utf8', timeout: 60_000 });
            const metadata = JSON.parse(inspect.stdout)[0];
            if (metadata.Id !== manifest.environment.imageDigests[image.instanceId]) throw new Error('image id differs from the reviewed manifest');
            const tag = spawnSync('docker', ['tag', reference, image.repository + ':latest'], { stdio: 'inherit', timeout: 60_000 });
            if (tag.status !== 0) throw new Error('could not bind scorer image tag to frozen digest');
          }
          NODE
          python -m swebench.harness.run_evaluation --help >/dev/null

      - name: Validate the complete development path without a model key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEEPSEEK_API_KEY:-}" ]]; then echo 'unexpected model key in preflight stage' >&2; exit 2; fi
          node dist/scripts/swebench/run.js --manifest "$SWE_INPUT_ROOT/manifest.json" \
            --dataset "$SWE_INPUT_ROOT/dataset.agent.json" --scoring-dataset "$SWE_INPUT_ROOT/dataset.scoring.json" \
            --external-python "$RUNNER_TEMP/swe-python/bin/python" --evidence-root "$SWE_EVIDENCE_ROOT" \
            --split development --backend docker --scoring official --batch-id swe-components-dev-20261030 --validate-only \
            | tee "$SWE_PUBLIC_ROOT/preflight.json"
          test ! -e "$SWE_EVIDENCE_ROOT"

      - name: Verify one-time paid dispatch authorization
        env:
          GH_TOKEN: ${{ github.token }}
          SWE_APPROVED_MANIFEST: ${{ inputs.authorized_manifest_sha256 }}
          SWE_GATE_OUTPUT: ${{ runner.temp }}/swe-development-public/paid-gate.json
          SWE_EXECUTE_REQUESTED: ${{ inputs.component_development_execute }}
        run: node .github/scripts/swe-development-gate.mjs

      - name: Execute the separately authorized development batch
        if: inputs.component_development_execute
        env:
          DEEPSEEK_API_KEY: ${{ secrets.MINI_DSH_SWE_DEV_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then echo 'authorized temporary model credential is absent' >&2; exit 2; fi
          test ! -e "$SWE_EVIDENCE_ROOT"
          node dist/scripts/swebench/run.js --manifest "$SWE_INPUT_ROOT/manifest.json" \
            --dataset "$SWE_INPUT_ROOT/dataset.agent.json" --scoring-dataset "$SWE_INPUT_ROOT/dataset.scoring.json" \
            --external-python "$RUNNER_TEMP/swe-python/bin/python" --evidence-root "$SWE_EVIDENCE_ROOT" \
            --split development --backend docker --scoring official --batch-id swe-components-dev-20261030 --execute \
            > "$SWE_EXECUTION_LOG" 2>&1

      - name: Prepare public aggregates and encrypted raw evidence
        if: always() && steps.inputs.outcome == 'success'
        run: node .github/scripts/swe-development-artifact.mjs

      - name: Upload scoped development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swe-component-development
          path: ${{ runner.temp }}/swe-development-public/
          if-no-files-found: warn
          retention-days: 7

  component-environment:
    name: Frozen SWE component environment (no model)
    if: github.event_name == 'workflow_dispatch' && inputs.component_environment_probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build the frozen product source
        run: pnpm install --frozen-lockfile && pnpm check

      - name: Pull pinned public images and verify both command environments
        env:
          PROBE_DIRECTORY: ${{ runner.temp }}/swe-component-environment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { probeCommandEnvironment, TESTBED_PROBE } from './dist/scripts/swebench/command-environment.js';
          import { prepareDockerWorkspace } from './dist/scripts/swebench/workspace.js';
          import { createDockerCandidateRunner } from './dist/scripts/swebench/docker-candidate.js';
          const inputBytes = await fs.readFile('docs/samples/swe-component-environment-20261030.json');
          const input = JSON.parse(inputBytes.toString('utf8'));
          if (input.schemaVersion !== 1 || input.kind !== 'swe-component-environment-probe' || !/^[a-f0-9]{40}$/.test(input.sourceCommit) || input.images.length !== 5 || new Set(input.images.map(image => image.instanceId)).size !== 5) throw new Error('invalid five-image probe contract');
          const output = process.env.PROBE_DIRECTORY;
          await fs.mkdir(output, { recursive: true });
          const identity = spawnSync('git', ['diff', '--quiet', input.sourceCommit, 'HEAD', '--', 'src', 'scripts', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'plugins.config.ts']);
          if (identity.status !== 0) throw new Error('probe product source differs from the frozen paid source');
          const result = { kind: input.kind, sourceCommit: input.sourceCommit, workflowCommit: spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).stdout.trim(), inputSha256: createHash('sha256').update(inputBytes).digest('hex'), checkedAt: new Date().toISOString(), paidRequests: 0, images: [] };
          const run = (args, timeout = 60_000) => spawnSync('docker', args, { encoding: 'utf8', timeout, maxBuffer: 32 * 1024 * 1024 });
          let failed = false;
          for (const [index, image] of input.images.entries()) {
            if (!/^swebench\/[a-z0-9_.-]+$/.test(image.repository) || !/^sha256:[a-f0-9]{64}$/.test(image.digest) || !/^[\w-]+$/.test(image.instanceId)) throw new Error('invalid pinned image identity');
            const reference = `${image.repository}@${image.digest}`;
            const record = { instanceId: image.instanceId, reference };
            const workspace = path.join(output, 'workspaces', image.instanceId);
            let candidate;
            try {
              const pull = run(['pull', reference], 900_000);
              await fs.writeFile(path.join(output, `${image.instanceId}.pull.log`), `${pull.stdout ?? ''}\n${pull.stderr ?? ''}`);
              if (pull.status !== 0) throw new Error(`image pull failed: ${pull.error?.message ?? pull.status}`);
              const inspect = run(['image', 'inspect', reference]);
              if (inspect.status !== 0) throw new Error('pinned image inspection failed');
              const metadata = JSON.parse(inspect.stdout)[0];
              if (!metadata.RepoDigests.includes(reference)) throw new Error('registry digest changed');
              record.imageId = metadata.Id;
              record.testbed = probeCommandEnvironment(metadata.Id, process.getuid(), process.getgid());
              if (!/^[a-f0-9]{40}$/.test(image.baseCommit)) throw new Error('invalid task base commit');
              const name = `mini-dsh-env-${process.env.GITHUB_RUN_ID}-${index}`;
              await fs.mkdir(path.dirname(workspace), { recursive: true });
              candidate = await prepareDockerWorkspace({ image: metadata.Id, baseCommit: image.baseCommit, target: workspace, exportName: `${name}-export`, containerName: name });
              const legacyRunner = createDockerCandidateRunner(workspace, name);
              const activeRunner = createDockerCandidateRunner(workspace, name, { commandEnvironment: 'testbed-v1' });
              const options = command => ({ executable: 'bash', args: ['-lc', command], command, cwd: workspace, signal: new AbortController().signal, timeoutMs: 30_000, maxCaptureBytes: 64 * 1024 });
              const legacy = await legacyRunner(options(TESTBED_PROBE));
              record.legacy = { status: legacy.status, exitCode: legacy.exitCode, probePassed: legacy.status === 'exited' && legacy.exitCode === 0 };
              await fs.writeFile(path.join(output, `${image.instanceId}.legacy.log`), JSON.stringify(legacy, null, 2));
              const active = await activeRunner(options(TESTBED_PROBE));
              if (active.status !== 'exited' || active.exitCode !== 0) throw new Error('candidate did not enter testbed');
              record.candidate = JSON.parse(active.stdout.text.trim().split('\n').at(-1));
              record.isolation = candidate.evidence;
              if (!Array.isArray(image.imports) || image.imports.some(name => !/^[a-z_]+$/.test(name))) throw new Error('invalid dependency import list');
              const command = `python -c 'import ${image.imports.join(', ')}; print("dependency-imports-ok")'`;
              const imports = await activeRunner(options(command));
              await fs.writeFile(path.join(output, `${image.instanceId}.imports.log`), JSON.stringify(imports, null, 2));
              if (imports.status !== 'exited' || imports.exitCode !== 0) throw new Error('testbed task dependencies could not import');
              record.dependenciesPassed = true;
              await fs.writeFile(path.join(workspace, 'mini_dsh_environment_canary'), 'host-visible\n');
              const visibility = await activeRunner(options('test "$(cat mini_dsh_environment_canary)" = "host-visible" && printf "container-visible\\n" > mini_dsh_environment_canary'));
              if (visibility.exitCode !== 0 || await fs.readFile(path.join(workspace, 'mini_dsh_environment_canary'), 'utf8') !== 'container-visible\n') throw new Error('host/container files are not bidirectionally visible');
              record.bidirectionalFiles = true;
              record.status = 'passed';
            } catch (error) {
              failed = true;
              record.status = 'failed';
              record.error = String(error);
            } finally {
              try {
                if (candidate) candidate.cleanup();
                await fs.rm(workspace, { recursive: true, force: true });
              } catch (error) {
                failed = true;
                record.status = 'failed';
                record.cleanupError = String(error);
              }
              result.images.push(record);
              await fs.writeFile(path.join(output, 'result.json'), JSON.stringify(result, null, 2) + '\n');
              run(['image', 'rm', reference]);
            }
            console.log(JSON.stringify(record));
          }
          if (failed) process.exitCode = 1;
          NODE

      - name: Upload zero-model environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swe-component-environment
          path: |
            ${{ runner.temp }}/swe-component-environment/result.json
            ${{ runner.temp }}/swe-component-environment/*.log
          if-no-files-found: warn
          retention-days: 7

  swebench-poc:
    name: Official SWE-bench no-model PoC
    if: github.event_name == 'workflow_dispatch' && inputs.swebench_poc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Pin official harness and public dataset
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/swebench-poc"
          mkdir -p "$root"
          git clone --depth 1 --branch v3.0.17 https://github.com/SWE-bench/SWE-bench.git "$root/official-harness"
          test "$(git -C "$root/official-harness" rev-parse HEAD)" = 3f01bd622c0a22c00406139f69a234ef08225f22
          python -m pip install -e "$root/official-harness" pyarrow
          curl --fail --location --retry 2 \
            'https://huggingface.co/datasets/princeton-nlp/SWE-bench_Verified/resolve/c104f840cc67f8b6eec6f759ebc8b2693d585d4a/data/test-00000-of-00001.parquet' \
            --output "$root/verified.parquet"
          python scripts/swebench/poc_official.py --dataset "$root/verified.parquet" \
            --harness "$root/official-harness" --out "$root/result"
          df -h "$RUNNER_TEMP"

      - name: Execute the official gold adjudication twice
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/swebench-poc"
          python scripts/swebench/poc_official.py --dataset "$root/verified.parquet" \
            --harness "$root/official-harness" --out "$root/result" \
            --run-id-prefix "mini-dsh-${{ github.run_id }}" --execute

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build the candidate adapter
        run: pnpm install --frozen-lockfile && pnpm check

      - name: Verify candidate file and Bash paths, then score its exported patch
        run: node dist/scripts/swebench/poc-candidate.js

      - name: Upload no-model PoC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swebench-poc-evidence
          path: |
            ${{ runner.temp }}/swebench-poc/result/manifest.json
            ${{ runner.temp }}/swebench-poc/result/*.log
            ${{ runner.temp }}/swebench-poc/result/gold.*.json
            ${{ runner.temp }}/swebench-poc/result/candidate-evidence.json
            ${{ runner.temp }}/swebench-poc/result/mini-dsh-poc-no-model.*.json
          if-no-files-found: warn
          retention-days: 7
